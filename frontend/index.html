<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthGuard AI - Autenticador Cognitivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            width: 24px;
            border-radius: 4px;
            background: var(--primary);
        }

        .step-content {
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .step-content.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin: 0 auto 24px;
            width: fit-content;
        }

        .info-box {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-family: monospace;
            font-size: 16px;
            color: var(--accent);
            word-break: break-all;
        }

        .token-input-wrapper {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .token-char {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        #result-badge {
            display: none;
            margin-top: 24px;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success { background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.2); }
        .error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="step-indicator">
                <div class="step-dot active" id="dot-1"></div>
                <div class="step-dot" id="dot-2"></div>
                <div class="step-dot" id="dot-3"></div>
            </div>

            <!-- STEP 1: SETUP -->
            <div class="step-content active" id="step-1">
                <div class="header">
                    <div class="logo-icon">🛡️</div>
                    <h1>Configurar 2FA</h1>
                    <p class="subtitle">Insira seu e-mail para começar</p>
                </div>
                <div class="input-group">
                    <label>E-mail da Conta</label>
                    <input type="email" id="email-input" placeholder="exemplo@email.com" value="user@example.com">
                </div>
                <button class="btn" onclick="startSetup()" id="btn-setup">
                    <span>Iniciar Setup</span>
                    <div class="loader" id="loader-setup"></div>
                </button>
            </div>

            <!-- STEP 2: ACTIVATION -->
            <div class="step-content" id="step-2">
                <div class="header">
                    <h1>Ativar Autenticador</h1>
                    <p class="subtitle">Escaneie o código com seu app</p>
                </div>
                <div id="qrcode"></div>
                <div class="info-box">
                    <div class="info-label">Chave Manual</div>
                    <div class="info-value" id="secret-value">-</div>
                </div>
                <button class="btn" onclick="goToStep(3)">
                    Próximo Passo
                </button>
            </div>

            <!-- STEP 3: VALIDATION -->
            <div class="step-content" id="step-3">
                <div class="header">
                    <h1>Verificação</h1>
                    <p class="subtitle">Insira o código de 6 dígitos</p>
                </div>
                <div class="input-group">
                    <input type="text" id="token-input" maxlength="6" placeholder="000 000" 
                        style="text-align: center; font-size: 32px; letter-spacing: 8px; font-weight: 700;">
                </div>
                <button class="btn" onclick="verifyToken()" id="btn-verify">
                    <span>Validar Acesso</span>
                    <div class="loader" id="loader-verify"></div>
                </button>

                <div id="result-badge"></div>
                
                <button class="btn" style="margin-top: 16px; background: transparent; border: 1px solid var(--border);" onclick="goToStep(2)">
                    Voltar ao QR Code
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/totp';
        let currentSecret = '';
        let currentAccount = '';

        function goToStep(step) {
            document.querySelectorAll('.step-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.step-dot').forEach(d => d.classList.remove('active'));
            
            document.getElementById(`step-${step}`).classList.add('active');
            document.getElementById(`dot-${step}`).classList.add('active');
        }

        async function startSetup() {
            const email = document.getElementById('email-input').value;
            const btn = document.getElementById('btn-setup');
            const loader = document.getElementById('loader-setup');

            if (!email) return alert('Email é obrigatório');

            btn.disabled = true;
            loader.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/setup?account=${encodeURIComponent(email)}`);
                const data = await response.json();

                currentSecret = data.secret;
                currentAccount = email;

                // Gerar QR Code
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), {
                    text: data.qrUri,
                    width: 180,
                    height: 180,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff"
                });

                document.getElementById('secret-value').innerText = data.secret;
                goToStep(2);
            } catch (err) {
                alert('Erro ao conectar com o backend. Verifique se ele está rodando em localhost:8080');
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        async function verifyToken() {
            const token = document.getElementById('token-input').value.replace(/\s/g, '');
            const btn = document.getElementById('btn-verify');
            const loader = document.getElementById('loader-verify');
            const badge = document.getElementById('result-badge');

            if (token.length !== 6) return alert('Insira os 6 dígitos');

            btn.disabled = true;
            loader.style.display = 'block';
            badge.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account: currentAccount,
                        secret: currentSecret,
                        token: token
                    })
                });

                const data = await response.json();

                badge.style.display = 'block';
                if (data.valid) {
                    badge.className = 'success';
                    badge.innerHTML = `✅ Acesso Autorizado!<br><small>Risco Cognitivo: ${data.riskScore}%</small>`;
                } else {
                    badge.className = 'error';
                    badge.innerHTML = `❌ Negado: ${data.message}<br><small>Risco Cognitivo: ${data.riskScore}%</small>`;
                }
            } catch (err) {
                alert('Erro na verificação.');
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // Auto-focus no input de token quando chegar no step 3
        document.getElementById('token-input').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
