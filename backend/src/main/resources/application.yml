server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: authguard-ai
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
    cache-names: riskAssessments
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=30s,recordStats
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  ai-engine:
    base-url: ${AI_ENGINE_URL:http://localhost:8000}
    timeout-ms: ${AI_ENGINE_TIMEOUT_MS:800}
    high-risk-threshold: ${HIGH_RISK_THRESHOLD:80}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
    refill-period-seconds: ${RATE_LIMIT_REFILL_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.authguard: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
